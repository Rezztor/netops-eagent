# Answers for Debian's installer. Everything is answered here except the disk:
# "Select disk to partition" is asked when the machine has more than one, and
# "Write the changes to disks?" (default No) is always asked. Those two stay
# open on purpose; tests/test_iso_build.py fails if a line here answers them.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# No network during the install. Everything comes from this media.
d-i netcfg/enable boolean false
d-i hw-detect/load_firmware boolean false
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/disable-cdrom-entries boolean true

# No password is set here. root cannot sign in, and the console account is
# created locked ("!"); rezztor-setup sets its password at first boot.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Rezztor console administrator
d-i passwd/username string rezadmin
d-i passwd/user-password-crypted password !

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean false

# One disk: EFI or BIOS boot partition, an ext4 root (Docker's data lives
# there), swap. The disk and the erase confirmation are not answered.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish

tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Known limit of this test build: with recommended packages off, Debian's
# installer leaves out the signed GRUB (grub-efi-amd64-signed), so the disk
# gets an unsigned boot loader and the installed machine does not start with
# Secure Boot on. Removing the next line is the likely fix. It was not kept,
# because the install test could not be repeated with it (2026-10-05).
d-i base-installer/install-recommends boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default
# Also write the removable-media boot path, so the disk still boots when the
# firmware's boot entries are lost (a moved or copied virtual machine).
d-i grub-installer/force-efi-extra-removable boolean true

# Our part: copy the payload, install Docker and the host tools from it.
d-i preseed/late_command string sh /cdrom/rezztor/install-target.sh

d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note

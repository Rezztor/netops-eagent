# Legacy BIOS boot menu.
path
default vesamenu.c32
prompt 0
timeout 0
menu title Rezztor EAgent installer   [TEST BUILD, not signed]
label install
    menu label ^Install Rezztor EAgent   [TEST BUILD, not signed]
    menu default
    kernel /install.amd/vmlinuz
    append initrd=/install.amd/initrd.gz preseed/file=/cdrom/preseed.cfg locale=en_US.UTF-8 keymap=us priority=critical vga=788 --- quiet
label disk
    menu label ^Boot from the first disk
    localboot 0x80

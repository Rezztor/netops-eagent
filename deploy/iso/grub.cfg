# UEFI boot menu. This file is not signed; Debian's signed boot files load it.
set timeout=-1
set default=0
menuentry 'Install Rezztor EAgent   [TEST BUILD, not signed]' {
    linux /install.amd/vmlinuz preseed/file=/cdrom/preseed.cfg locale=en_US.UTF-8 keymap=us priority=critical vga=788 --- quiet
    initrd /install.amd/initrd.gz
}
menuentry 'Boot from the first disk' {
    exit
}

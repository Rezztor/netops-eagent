# Goes with the network guard (research 04, section 5.6). The appliance has an
# address in several networks and is a router for none of them.
#
# Strict reverse path: a packet whose source this machine would not answer
# through the same interface is dropped, so a device network cannot pose as
# another network.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Answer ARP only for the address of the interface asked, and announce only it.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
# Never a router for IPv6. The guard also drops forwarded IPv6, and switches
# IPv6 off on every device network when it loads.
net.ipv6.conf.all.forwarding = 0

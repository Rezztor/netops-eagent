# TLS front for the product. The certificate is made on this machine by
# rezztor-setup; the product listens on 127.0.0.1:50080 only.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate     /etc/rezztor/tls/cert.pem;
    ssl_certificate_key /etc/rezztor/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # No request log here. A password-reset link carries its token in the query
    # string, and the MCP and A2A endpoints carry theirs in the path; the
    # product keeps both out of its own access log, which is the record of who
    # asked for what. Left to the distribution's default, this server would
    # write every request line and Referer whole to /var/log/nginx/access.log.
    access_log off;
    # The same for the error log: a request the product did not answer (it is
    # starting) is written there at level "error", request line and all.
    error_log /var/log/nginx/error.log crit;
    # A request body goes straight to the product and is never kept on this
    # machine's disk first: buffered, a body of any size from anybody was
    # written to /var/lib/nginx whole before the product could refuse it.
    # The limit here is the product's largest (UPLOAD_LIMIT_BYTES in
    # helpers/ui_server.py), so an upload over it is answered 413 by nginx.
    # The product's smaller limits still apply behind it.
    client_max_body_size 5g;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:50080;
        proxy_http_version 1.1;
        # The product compares the browser's Origin with these two.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        # The browser's address, for the sign-in throttle and the audit record.
        # Set, never added to: what the browser sent under this name is dropped.
        # The product believes it only from this machine (FORWARDED_ALLOW_IPS).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Answers are streamed and a conversation's socket stays open.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        error_page 502 503 504 = @starting;
    }

    location @starting {
        default_type text/plain;
        # Also what a request larger than the product accepts gets: the product
        # answers 413 and closes while the body is still on its way, and nginx
        # reports the closed connection, not the answer.
        return 503 "Rezztor EAgent did not answer. It is starting, setup has not finished, or the request was larger than it accepts.\n";
    }
}

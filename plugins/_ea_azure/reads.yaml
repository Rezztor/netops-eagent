# The named reads: the whole of what `azure_read` can ask Azure. Loaded and checked by helpers/live.py.
#
# An entry is one Azure Resource Manager call on a resource that is in the stored inventory. The address is
# `https://management.azure.com` + the stored resource ID + `suffix`; the model never supplies a URL, a path, a
# method or a body, only a read name, a resource and the typed `args`. `{name}` in `query` and `body` is replaced
# by a checked value (an `args` entry, `resource`, `subscription`, or from a `duration` arg: `start`, `end`,
# `timespan`, `interval`); `{name:int}` sends a number.
#
#   method GET   role reader        a plain read; the Reader role is enough
#   method POST  role diagnostics   a probe: Azure answers a question and changes nothing (Network Watcher, effective
#                                   routes, BGP status). Needs the custom Rezztor Diagnostics role. A POST that is not
#                                   one of these is refused by the loader.
#   scope        resource (default) | subscription (the stored ID's subscription) | watcher (the Network Watcher
#                of the resource's region and subscription, from the inventory; the resource goes into the body)
#   keep         the allow-list of what comes back (helpers/shape.py's path language). `each: <list path>` with a
#                `keep:` is a list of objects; a plain mapping is a nested object. Nothing else is returned.
#   requires     the Azure action a 403 says is missing
#
# Reviewed like the catalogue: a new entry needs a reviewer, and tests/test_azure_live.py fails when a suffix
# matches live.NEVER (run command, shared keys, secrets, publishing files, packet capture, every stop-like call).
#
# unverified: every api-version, path and answer shape below is from Microsoft's REST reference (research R2 section
# 4), not yet called on a real tenant (build contract phase 4, test session 3). Left out on purpose: ExpressRoute
# route tables and IKE SAs (answer shapes not confirmed), a single App Service detector (its name would have to be
# part of the path), App Service deployments (author e-mail), VM extensions (settings can hold credentials).

# --- plain reads (Reader) -----------------------------------------------------------------------------------------

- name: vm_instance_view
  summary: Power state, VM agent state and extension health of one virtual machine.
  resource_type: microsoft.compute/virtualmachines
  method: GET
  suffix: /instanceView
  api_version: "2025-04-01"
  role: reader
  requires: Microsoft.Compute/virtualMachines/instanceView/read
  keep:
    os: {name: osName, version: osVersion}
    agent_version: vmAgent.vmAgentVersion
    agent_status: {each: vmAgent.statuses, keep: {code: code, status: displayStatus, level: level}}
    status: {each: statuses, keep: {code: code, status: displayStatus, level: level, time: time}}
    extensions: {each: extensions, keep: {name: name, type: type, version: typeHandlerVersion,
                                           status: {each: statuses, keep: {code: code, status: displayStatus, level: level}}}}

- name: resource_health
  summary: Whether Azure says this resource is Available, Degraded or Unavailable, and why.
  resource_type: "*"
  method: GET
  suffix: /providers/Microsoft.ResourceHealth/availabilityStatuses/current
  api_version: "2025-05-01"
  role: reader
  requires: Microsoft.ResourceHealth/availabilityStatuses/current/read
  keep:
    state: properties.availabilityState
    summary: properties.summary
    reason_type: properties.reasonType
    occurred_at: properties.occuredTime|properties.occurredTime
    reported_at: properties.reportedTime

- name: service_health
  summary: Azure incidents, maintenance and advisories that affect this resource's subscription.
  resource_type: "*"
  scope: subscription
  method: GET
  suffix: /providers/Microsoft.ResourceHealth/events
  api_version: "2025-05-01"
  args:
    duration: {type: duration, default: P3D, max: P30D}
  query:
    queryStartTime: "{start}"
  role: reader
  requires: Microsoft.ResourceHealth/events/read
  keep:
    events: {each: value, keep: {name: name, type: properties.eventType, status: properties.status,
                                  title: properties.title, summary: properties.summary, level: properties.level,
                                  started_at: properties.impactStartTime, mitigated_at: properties.impactMitigationTime,
                                  services: "properties.impact[].impactedService",
                                  regions: "properties.impact[].impactedRegions[].impactedRegion"}}

- name: activity_log
  summary: Who changed this resource and when, from Azure's activity log (writes, deletes and actions, not reads).
  resource_type: "*"
  scope: subscription
  method: GET
  suffix: /providers/Microsoft.Insights/eventtypes/management/values
  api_version: "2015-04-01"
  args:
    duration: {type: duration, default: P1D, max: P7D}
  query:
    $filter: "eventTimestamp ge '{start}' and eventTimestamp le '{end}' and resourceUri eq '{resource}'"
    $select: eventTimestamp,caller,operationName,status,subStatus,level,resourceId
  role: reader
  requires: Microsoft.Insights/eventtypes/values/Read
  keep:
    events: {each: value, keep: {time: eventTimestamp, who: caller, operation: operationName.value, status: status.value,
                                  sub_status: subStatus.value, level: level}}

- name: vm_metrics
  summary: Metric values of a virtual machine over a recent period (average and maximum).
  resource_type: microsoft.compute/virtualmachines
  method: GET
  suffix: /providers/Microsoft.Insights/metrics
  api_version: "2023-10-01"
  args:
    metric: {type: enum_list, max: 5, values: [Percentage CPU, Available Memory Bytes, VmAvailabilityMetric,
                                               Network In Total, Network Out Total, OS Disk Queue Depth]}
    duration: {type: duration, default: PT1H, max: P1D}
  query: &metric_query
    timespan: "{timespan}"
    interval: "{interval}"
    metricnames: "{metric}"
    aggregation: Average,Maximum
  role: reader
  requires: Microsoft.Insights/Metrics/Read
  keep: &metric_keep
    metrics: {each: value, keep: {name: name.value, unit: unit,
                                   points: {each: "timeseries[].data[]", keep: {time: timeStamp, average: average, maximum: maximum}}}}


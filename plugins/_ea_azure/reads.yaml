# --- log queries (kind: kql; helpers/logs.py runs them, as the log app) ----------------------------------------------
#
# Fixed query text; the only variable parts are the typed args, put in as KQL string literals by code (never pasted
# into the text), so the text a card shows is exactly what is sent. `tables` are the tables the text reads; every one
# must also be in the settings' `logs.tables` or the read is refused. A `duration` arg is the time range, sent with the
# call, not part of the text. The loader runs every text through the same guard as a free-form query, so an entry
# that could not be typed in as one does not load. The workspace is chosen at request time from the settings.
#
# unverified: the columns are from Microsoft's table reference (learn.microsoft.com/azure/azure-monitor/reference/
# tables/azfwnetworkrule, azfwapplicationrule, heartbeat); not run against a workspace (test sessions 3 and 4).

- name: fw_network_denied
  kind: kql
  summary: What Azure Firewall network rules denied, by source, destination, port and rule (structured firewall logs).
  tables: [AZFWNetworkRule]
  args:
    ip: {type: ip, optional: true}
    port: {type: port, optional: true}
    duration: {type: duration, default: PT1H, max: P7D}
  text: |
    AZFWNetworkRule
    | where Action == "Deny"
    | where isempty({ip}) or SourceIp == {ip} or DestinationIp == {ip}
    | where isempty({port}) or tostring(DestinationPort) == {port}
    | summarize hits = count(), last_seen = max(TimeGenerated) by SourceIp, DestinationIp, DestinationPort, Protocol, Policy, RuleCollectionGroup, RuleCollection, Rule, ActionReason
    | order by hits desc

- name: fw_application_denied
  kind: kql
  summary: What Azure Firewall application rules denied, by source, target name and rule (structured firewall logs).
  tables: [AZFWApplicationRule]
  args:
    ip: {type: ip, optional: true}
    duration: {type: duration, default: PT1H, max: P7D}
  text: |
    AZFWApplicationRule
    | where Action == "Deny"
    | where isempty({ip}) or SourceIp == {ip}
    | summarize hits = count(), last_seen = max(TimeGenerated) by SourceIp, Fqdn, Protocol, DestinationPort, Policy, RuleCollectionGroup, RuleCollection, Rule, ActionReason
    | order by hits desc

- name: heartbeat_last_seen
  kind: kql
  summary: When each machine reporting to the workspace last sent a heartbeat, oldest first (a silent machine is a gap in monitoring).
  tables: [Heartbeat]
  args:
    duration: {type: duration, default: P1D, max: P7D}
  text: |
    Heartbeat
    | summarize last_seen = max(TimeGenerated), beats = count() by Computer, OSType
    | order by last_seen asc

- name: diagnostic_settings
  summary: Whether this resource sends logs and metrics anywhere, which categories, and to which workspace.
  resource_type: "*"
  method: GET
  suffix: /providers/Microsoft.Insights/diagnosticSettings
  api_version: 2021-05-01-preview
  role: reader
  requires: Microsoft.Insights/DiagnosticSettings/Read
  keep:
    settings: {each: value, keep: {name: name, workspace: properties.workspaceId,
                                    logs: {each: properties.logs, keep: {category: category, group: categoryGroup, enabled: enabled}},
                                    metrics: {each: properties.metrics, keep: {category: category, enabled: enabled}}}}

- name: flow_logs
  summary: The flow logs a Network Watcher has, what each one watches and whether it is on.
  resource_type: microsoft.network/networkwatchers
  method: GET
  suffix: /flowLogs
  api_version: "2025-09-01"
  role: reader
  requires: Microsoft.Network/networkWatchers/flowLogs/read
  keep:
    flow_logs: {each: value, keep: {name: name, target: properties.targetResourceId, enabled: properties.enabled,
                                     storage: properties.storageId, retention_days: properties.retentionPolicy.days,
                                     traffic_analytics: properties.flowAnalyticsConfiguration.networkWatcherFlowAnalyticsConfiguration.enabled}}

- name: firewall_get
  summary: An Azure Firewall's SKU, policy, private address and provisioning state.
  resource_type: microsoft.network/azurefirewalls
  method: GET
  suffix: ""
  api_version: "2025-09-01"
  role: reader
  requires: Microsoft.Network/azureFirewalls/read
  keep:
    sku: sku.name
    tier: sku.tier
    state: properties.provisioningState
    threat_intel: properties.threatIntelMode
    policy: properties.firewallPolicy.id
    private_ip: "properties.ipConfigurations[].properties.privateIPAddress"

- name: firewall_policy
  summary: A firewall policy's tier, threat intelligence mode, DNS proxy and parent policy.
  resource_type: microsoft.network/firewallpolicies
  method: GET
  suffix: ""
  api_version: "2025-09-01"
  role: reader
  requires: Microsoft.Network/firewallPolicies/read
  keep:
    tier: properties.sku.tier
    state: properties.provisioningState
    threat_intel: properties.threatIntelMode
    base_policy: properties.basePolicy.id
    dns_proxy: properties.dnsSettings.enableProxy
    dns_servers: properties.dnsSettings.servers

- name: firewall_rule_groups
  summary: Every rule collection group of a firewall policy with its collections and rules (addresses, ports, FQDNs, action).
  resource_type: microsoft.network/firewallpolicies
  method: GET
  suffix: /ruleCollectionGroups
  api_version: "2025-09-01"
  role: reader
  requires: Microsoft.Network/firewallPolicies/ruleCollectionGroups/read
  keep:
    groups: {each: value, keep: {name: name, priority: properties.priority,
      collections: {each: properties.ruleCollections, keep: {name: name, priority: priority, type: ruleCollectionType,
        action: action.type,
        rules: {each: rules, keep: {name: name, type: ruleType, protocols: "ipProtocols|protocols[].protocolType",
                                    sources: sourceAddresses, source_groups: sourceIpGroups,
                                    destinations: destinationAddresses, destination_groups: destinationIpGroups,
                                    destination_fqdns: destinationFqdns, destination_ports: destinationPorts,
                                    target_fqdns: targetFqdns, translated_address: translatedAddress,
                                    translated_port: translatedPort}}}}}}

- name: vpn_connection
  summary: A VPN or VNet-to-VNet connection's status, tunnels and traffic counters. Never its shared key.
  resource_type: microsoft.network/connections
  method: GET
  suffix: ""
  api_version: "2025-09-01"
  role: reader
  requires: Microsoft.Network/connections/read
  keep:
    status: properties.connectionStatus
    type: properties.connectionType
    protocol: properties.connectionProtocol
    bgp: properties.enableBgp
    ingress_bytes: properties.ingressBytesTransferred
    egress_bytes: properties.egressBytesTransferred
    tunnels: {each: properties.tunnelConnectionStatus, keep: {tunnel: tunnel, status: connectionStatus,
                                                                established: lastConnectionEstablishedUtcTime}}

- name: vpn_gateway
  summary: A virtual network gateway's type, SKU, BGP settings and provisioning state.
  resource_type: microsoft.network/virtualnetworkgateways
  method: GET
  suffix: ""
  api_version: "2025-09-01"
  role: reader
  requires: Microsoft.Network/virtualNetworkGateways/read
  keep:
    gateway_type: properties.gatewayType
    vpn_type: properties.vpnType
    sku: properties.sku.name
    active_active: properties.activeActive
    state: properties.provisioningState
    bgp_asn: properties.bgpSettings.asn
    bgp_peering_address: properties.bgpSettings.bgpPeeringAddress

- name: vnet_peerings
  summary: The live state and flags of every peering of a virtual network.
  resource_type: microsoft.network/virtualnetworks
  method: GET
  suffix: /virtualNetworkPeerings
  api_version: "2025-09-01"
  role: reader
  requires: Microsoft.Network/virtualNetworks/virtualNetworkPeerings/read
  keep:
    peerings: {each: value, keep: {name: name, state: properties.peeringState, sync: properties.peeringSyncLevel,
                                    remote: properties.remoteVirtualNetwork.id,
                                    remote_address_space: properties.remoteAddressSpace.addressPrefixes,
                                    allow_forwarded: properties.allowForwardedTraffic,
                                    allow_gateway_transit: properties.allowGatewayTransit,
                                    use_remote_gateways: properties.useRemoteGateways}}

- name: private_dns_links
  summary: The virtual networks a private DNS zone is linked to and whether each link registers records.
  resource_type: microsoft.network/privatednszones
  method: GET
  suffix: /virtualNetworkLinks
  api_version: "2018-09-01"
  role: reader
  requires: Microsoft.Network/privateDnsZones/virtualNetworkLinks/read
  keep:
    links: {each: value, keep: {name: name, vnet: properties.virtualNetwork.id,
                                 registration: properties.registrationEnabled, state: properties.virtualNetworkLinkState}}

- name: private_dns_records
  summary: The A, AAAA and CNAME records of a private DNS zone (TXT and the rest are left out).
  resource_type: microsoft.network/privatednszones
  method: GET
  suffix: /ALL
  api_version: "2018-09-01"
  role: reader
  requires: Microsoft.Network/privateDnsZones/ALL/read
  keep:
    records: {each: value, keep: {name: name, type: type, ttl: properties.ttl, fqdn: properties.fqdn,
                                   a: "properties.aRecords[].ipv4Address", aaaa: "properties.aaaaRecords[].ipv6Address",
                                   cname: properties.cnameRecord.cname}}

- name: private_endpoint
  summary: A private endpoint's state, subnet, target service connection and the DNS names and addresses it needs.
  resource_type: microsoft.network/privateendpoints
  method: GET
  suffix: ""
  api_version: "2025-09-01"
  role: reader
  requires: Microsoft.Network/privateEndpoints/read
  keep:
    state: properties.provisioningState
    subnet: properties.subnet.id
    nics: "properties.networkInterfaces[].id"
    connections: {each: properties.privateLinkServiceConnections, keep: {name: name, target: properties.privateLinkServiceId,
                                                                          groups: properties.groupIds,
                                                                          status: properties.privateLinkServiceConnectionState.status}}
    dns: {each: properties.customDnsConfigs, keep: {fqdn: fqdn, addresses: ipAddresses}}

- name: site_state
  summary: A web app's state, availability, host names, plan and network settings.
  resource_type: microsoft.web/sites
  method: GET
  suffix: ""
  api_version: "2024-11-01"
  role: reader
  requires: Microsoft.Web/sites/Read
  keep:
    kind: kind
    state: properties.state
    availability: properties.availabilityState
    usage: properties.usageState
    enabled: properties.enabled
    host_names: properties.hostNames
    https_only: properties.httpsOnly
    plan: properties.serverFarmId
    vnet_subnet: properties.virtualNetworkSubnetId
    public_network_access: properties.publicNetworkAccess

- name: site_config
  summary: A web app's runtime, always-on, health check path, TLS minimum and access restrictions (nothing else of its configuration).
  resource_type: microsoft.web/sites
  method: GET
  suffix: /config/web
  api_version: "2024-11-01"
  role: reader
  requires: Microsoft.Web/sites/config/Read
  keep:
    runtime: properties.linuxFxVersion|properties.windowsFxVersion
    always_on: properties.alwaysOn
    health_check_path: properties.healthCheckPath
    min_tls_version: properties.minTlsVersion
    ftps_state: properties.ftpsState
    http2: properties.http20Enabled
    route_all_through_vnet: properties.vnetRouteAllEnabled
    ip_restrictions: {each: properties.ipSecurityRestrictions, keep: {name: name, action: action, priority: priority,
                                                                       ip: ip_address, tag: tag}}

- name: site_detectors
  summary: The diagnostic detectors Azure offers for a web app (names and descriptions).
  resource_type: microsoft.web/sites
  method: GET
  suffix: /detectors
  api_version: "2024-11-01"
  role: reader
  requires: Microsoft.Web/sites/detectors/read
  keep:
    detectors: {each: value, keep: {name: name, description: properties.metadata.description,
                                     category: properties.metadata.category}}

# --- probes (POST that changes nothing; the Rezztor Diagnostics role) -----------------------------------------------

- name: effective_routes
  summary: The routes that really apply to a network interface (system, user-defined and gateway-learned).
  resource_type: microsoft.network/networkinterfaces
  method: POST
  suffix: /effectiveRouteTable
  api_version: "2025-09-01"
  role: diagnostics
  requires: Microsoft.Network/networkInterfaces/effectiveRouteTable/action
  cost_note: No charge is documented for this call.
  keep:
    routes: {each: value, keep: {name: name, source: source, state: state, prefixes: addressPrefix,
                                  next_hop_type: nextHopType, next_hop_ips: nextHopIpAddress}}

- name: effective_security_rules
  summary: The network security group rules that really apply to a network interface, with the group each comes from.
  resource_type: microsoft.network/networkinterfaces
  method: POST
  suffix: /effectiveNetworkSecurityGroups
  api_version: "2025-09-01"
  role: diagnostics
  requires: Microsoft.Network/networkInterfaces/effectiveNetworkSecurityGroups/action
  cost_note: No charge is documented for this call.
  keep:
    groups: {each: value, keep: {nsg: networkSecurityGroup.id, subnet: association.subnet.id,
      nic: association.networkInterface.id,
      rules: {each: effectiveSecurityRules, keep: {name: name, priority: priority, direction: direction, access: access,
                                                   protocol: protocol,
                                                   sources: sourceAddressPrefix|sourceAddressPrefixes|expandedSourceAddressPrefix,
                                                   source_ports: sourcePortRange|sourcePortRanges,
                                                   destinations: destinationAddressPrefix|destinationAddressPrefixes|expandedDestinationAddressPrefix,
                                                   destination_ports: destinationPortRange|destinationPortRanges}}}}

- name: ip_flow_verify
  summary: Whether the network security groups allow or deny one flow to or from a virtual machine, and which rule decides.
  resource_type: microsoft.compute/virtualmachines
  scope: watcher
  method: POST
  suffix: /ipFlowVerify
  api_version: "2025-09-01"
  args:
    direction: {type: enum, values: [Inbound, Outbound]}
    protocol: {type: enum, values: [TCP, UDP]}
    local_ip: {type: ip}
    local_port: {type: port, default: "60000"}
    remote_ip: {type: ip}
    remote_port: {type: port}
  body:
    targetResourceId: "{resource}"
    direction: "{direction}"
    protocol: "{protocol}"
    localIPAddress: "{local_ip}"
    localPort: "{local_port}"
    remoteIPAddress: "{remote_ip}"
    remotePort: "{remote_port}"
  role: diagnostics
  requires: Microsoft.Network/networkWatchers/ipFlowVerify/action
  cost_note: A Network Watcher diagnostic check. The first 1,000 a month are free, then 0.001 USD each (Microsoft's price list).
  keep:
    access: access
    rule: ruleName

- name: next_hop
  summary: Where Azure sends a packet from a virtual machine to an address (hop type, address, route table).
  resource_type: microsoft.compute/virtualmachines
  scope: watcher
  method: POST
  suffix: /nextHop
  api_version: "2025-09-01"
  args:
    source_ip: {type: ip}
    destination_ip: {type: ip}
  body:
    targetResourceId: "{resource}"
    sourceIPAddress: "{source_ip}"
    destinationIPAddress: "{destination_ip}"
  role: diagnostics
  requires: Microsoft.Network/networkWatchers/nextHop/action
  cost_note: A Network Watcher diagnostic check. The first 1,000 a month are free, then 0.001 USD each (Microsoft's price list).
  keep:
    next_hop_type: nextHopType
    next_hop_ip: nextHopIpAddress
    route_table: routeTableId

- name: nsg_diagnostics
  summary: Every security rule evaluated for one flow to or from a virtual machine, any protocol, and the rule that matched.
  resource_type: microsoft.compute/virtualmachines
  scope: watcher
  method: POST
  suffix: /networkConfigurationDiagnostic
  api_version: "2025-09-01"
  args:
    direction: {type: enum, values: [Inbound, Outbound]}
    protocol: {type: enum, values: [TCP, UDP, Any]}
    source: {type: ip}
    destination: {type: ip}
    destination_port: {type: port}
  body:
    targetResourceId: "{resource}"
    profiles:
      - direction: "{direction}"
        protocol: "{protocol}"
        source: "{source}"
        destination: "{destination}"
        destinationPort: "{destination_port}"
  role: diagnostics
  requires: Microsoft.Network/networkWatchers/networkConfigurationDiagnostic/action
  cost_note: A Network Watcher diagnostic check. The first 1,000 a month are free, then 0.001 USD each (Microsoft's price list).
  keep:
    results: {each: results, keep: {direction: profile.direction, protocol: profile.protocol, source: profile.source,
                                     destination: profile.destination, destination_port: profile.destinationPort,
                                     access: networkSecurityGroupResult.securityRuleAccessResult,
                                     evaluated: {each: "networkSecurityGroupResult.evaluatedNetworkSecurityGroups",
                                                 keep: {nsg: networkSecurityGroupId, applied_to: appliedTo,
                                                        matched_rule: matchedRule.ruleName, action: matchedRule.action}}}}

- name: connection_check
  summary: Whether a virtual machine can reach an address and port (hops, latency, and the fault type when it cannot).
  resource_type: microsoft.compute/virtualmachines
  scope: watcher
  method: POST
  suffix: /connectivityCheck
  api_version: "2025-09-01"
  args:
    protocol: {type: enum, values: [Tcp, Icmp]}
    destination_ip: {type: ip}
    destination_port: {type: port, optional: true}
  body:
    source: {resourceId: "{resource}"}
    destination: {address: "{destination_ip}", port: "{destination_port:int}"}
    protocol: "{protocol}"
  role: diagnostics
  requires: Microsoft.Network/networkWatchers/connectivityCheck/action
  cost_note: A Network Watcher diagnostic check. The first 1,000 a month are free, then 0.001 USD each (Microsoft's price list). It may need the Network Watcher agent on the machine, which this product never installs.
  keep:
    status: connectionStatus
    latency_avg_ms: avgLatencyInMs
    latency_max_ms: maxLatencyInMs
    probes_sent: probesSent
    probes_failed: probesFailed
    hops: {each: hops, keep: {type: type, address: address, resource: resourceId,
                               issues: {each: issues, keep: {origin: origin, severity: severity, type: type}}}}

- name: vpn_bgp_peers
  summary: The BGP peers of a VPN gateway and the state of each session.
  resource_type: microsoft.network/virtualnetworkgateways
  method: POST
  suffix: /getBgpPeerStatus
  api_version: "2025-09-01"
  role: diagnostics

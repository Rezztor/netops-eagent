# `hosts: all` scoped by the job's --limit. Never a templated host pattern:
# the first attempt used `hosts: "{{ eagent_limit }}"` with nothing defining it,
# and every play failed. tests/test_net_catalogue.py checks for that.
#
# Dispatch is per task, for the same reason. This ran a single
# `ansible.netcommon.gather_facts`, which is not a module netcommon ships -- it
# has sixteen and that is not one of them -- so every job died with
# "couldn't resolve module/action" before reaching a device. The entry had never
# succeeded on any platform, and could not have: it was written from a
# documented interface that does not exist. Found by running it against a live
# SONiC VS lab on 2026-09-19.
#
# Each platform's own facts module is called instead, chosen by the host's
# `ansible_network_os`. Both accept the same `gather_subset` values the
# catalogue declares, so one variable serves both.
- name: Gather device facts
  hosts: all
  gather_facts: false
  tasks:
    - name: Establish which platform this host is
      # The FQCN tail: `ansible_network_os` is `cisco.ios.ios` on a modern
      # inventory and `ios` on an older one, and both have to mean the same
      # thing here.
      ansible.builtin.set_fact:
        eagent_platform: >-
          {{ (ansible_network_os | default('')) | regex_replace('^.*\.', '') }}

    - name: Refuse a host that does not say what it is
      # Rather than guessing a platform and sending one vendor's commands to
      # another's device. A group created in the Devices UI carries no
      # `ansible_network_os` today, so this is the error that names the reason.
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} has no ansible_network_os, so there is no way
          to know which facts module it answers. Set it on the host or its group
          (for example cisco.ios.ios, or dellemc.enterprise_sonic.sonic).
      when: eagent_platform | length == 0

    - name: Refuse a platform this entry does not cover
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} is {{ eagent_platform }}, which
          reads/device_facts does not cover. It is written for ios, nxos, eos,
          junos, sonic, sonic_community, fortios and panos.
      when: eagent_platform not in ['ios', 'nxos', 'eos', 'junos', 'sonic', 'sonic_community', 'fortios', 'panos']

    - name: Collect facts from a Cisco IOS device
      cisco.ios.ios_facts:
        gather_subset: "{{ gather_subset | default('all') }}"
      when: eagent_platform == 'ios'

    - name: Collect facts from a Cisco NX-OS device
      # nxos, eos and junos have not met a device. All three go over network_cli.
      cisco.nxos.nxos_facts:
        gather_subset: "{{ gather_subset | default('all') }}"
      when: eagent_platform == 'nxos'

    - name: Collect facts from an Arista EOS device
      arista.eos.eos_facts:
        gather_subset: "{{ gather_subset | default('all') }}"
      when: eagent_platform == 'eos'

    - name: Read facts from a Junos device
      # junos_facts needs netconf or PyEZ for most of what it returns; the CLI is the
      # one mechanism this estate uses, so these are `show` commands. In check mode
      # junos_command sends only commands that begin with `show`.
      juniper.device.junos_command:
        commands:
          - show version
          - show chassis hardware
          - show system uptime
      when: eagent_platform == 'junos'
      register: junos_facts

    - name: Show the facts from a Junos device
      ansible.builtin.debug:
        msg: "{{ dict(['show version', 'show chassis hardware', 'show system uptime'] | zip(junos_facts.stdout_lines)) }}"
      when: eagent_platform == 'junos'

    - name: Collect facts from a SONiC device
      dellemc.enterprise_sonic.sonic_facts:
        gather_subset: "{{ gather_subset | default('all') }}"
      when: eagent_platform == 'sonic'

    - name: Read facts from a sonic_community device
      # Plain SSH and `show`, because community SONiC has no Dell REST and no
      # network_cli terminal. `raw` is skipped in check mode, and the job always
      # runs in check mode, so this task opts out; it runs only the fixed
      # read-only commands below. `show version` crashes in networkop/sonic-vs
      # after its first line (KeyError: debian_version), so a non-zero exit is
      # not a failure here and the output is shown as it came back.
      ansible.builtin.raw: "{{ item }}"
      loop:
        - hostname
        - show version
        - show platform summary
      check_mode: false
      changed_when: false
      failed_when: false
      register: sonic_community_facts
      when: eagent_platform == 'sonic_community'

    - name: Show the facts from a sonic_community device
      ansible.builtin.debug:
        msg: "{{ sonic_community_facts.results | items2dict(key_name='item', value_name='stdout_lines') }}"
      when: eagent_platform == 'sonic_community'


    - name: Ask the firewall
      # FortiGate and Palo Alto: their management API over HTTPS with the stored API token, GET
      # only (reads/fw/read.yml). Written from the vendors' documented output, not run against a device.
      ansible.builtin.include_tasks: fw/read.yml
      vars:
        fw_read: facts
        fw_requests:
          fortios:
            - "/api/v2/monitor/system/status"
            - "/api/v2/cmdb/system/ha?format=mode%7Cgroup-name"
            - "/api/v2/monitor/system/ha-peer"
          panos:
            - "<show><system><info></info></system></show>"
            - "<show><high-availability><state></state></high-availability></show>"
      when: eagent_platform in ['fortios', 'panos']

    - name: Show the facts from the firewall
      ansible.builtin.debug:
        var: eagent_fw
      when: eagent_platform in ['fortios', 'panos']

    - name: Show the facts
      # Both modules put what they found in ansible_facts, so the engineer
      # reading the job sees the same shape whichever answered.
      ansible.builtin.debug:
        var: ansible_facts
      when: eagent_platform not in ['sonic_community', 'junos', 'fortios', 'panos']

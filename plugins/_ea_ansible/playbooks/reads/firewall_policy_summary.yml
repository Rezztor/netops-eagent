# `hosts: all` scoped by the job's --limit, per tests/test_net_catalogue.py.
#
# Policy names, actions and status with counts. Names only: no addresses, profiles or secrets.
# FortiGate (fortios): the REST API, GET only. Palo Alto (panos): the XML API, `show` commands
# only. Both over HTTPS with the stored API token, through reads/fw/read.yml, which holds every
# rule about how the call is made. Written from the vendors' documented output, not run against a
# device (see the catalogue).
- name: Summarise the firewall policy
  hosts: all
  gather_facts: false
  tasks:
    - name: Ask the firewall
      ansible.builtin.include_tasks: fw/read.yml
      vars:
        fw_read: firewall_policy_summary
        fw_requests:
          fortios:
            - "/api/v2/cmdb/firewall/policy?format=policyid%7Cname%7Cstatus%7Caction%7Csrcintf%7Cdstintf"
          panos:
            - "/config/devices/entry[@name='localhost.localdomain']/vsys/entry/rulebase/security/rules"

    - name: Show the answer
      ansible.builtin.debug:
        var: eagent_fw

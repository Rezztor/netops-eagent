# `hosts: all` scoped by the job's --limit, per tests/test_net_catalogue.py.
#
# This ran `cisco.ios.ios_interfaces` against every host in the group with no
# dispatch at all. Against a SONiC device the connection succeeds and the device
# answers -- with `Error: No such command "running-config"`, because it was sent
# an IOS command. So a mixed group broke on its first non-IOS member, which is
# the case groups exist for. Found against a live SONiC VS lab on 2026-09-19.
#
# IOS keeps the resource module, which returns structured interface state; it ran
# on a Cisco 3725 (IOS 12.4(15)T14) and returned every interface with its description. `sonic` is Dell Enterprise SONiC through
# `sonic_command` (network_cli), also not run against a device: the resource
# modules in dellemc.enterprise_sonic emit `configure terminal`, and a read has no
# business entering configuration mode. Community SONiC (networkop/sonic-vs) is
# `sonic_community`: its CLI has no `sonic-cli` and no `terminal length 0`, so
# network_cli never opens there ("unable to open sonic cli"); it is read over
# plain SSH, and that leg is the one proved against the lab.
- name: Read interface state
  hosts: all
  gather_facts: false
  tasks:
    - name: Establish which platform this host is
      ansible.builtin.set_fact:
        eagent_platform: >-
          {{ (ansible_network_os | default('')) | regex_replace('^.*\.', '') }}

    - name: Refuse a host that does not say what it is
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} has no ansible_network_os, so there is no way
          to know which command reads its interfaces. Set it on the host or its
          group (for example cisco.ios.ios, or dellemc.enterprise_sonic.sonic).
      when: eagent_platform | length == 0

    - name: Refuse a platform this entry does not cover
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} is {{ eagent_platform }}, which
          reads/interfaces does not cover. It is written for ios, sonic,
          sonic_community, fortios and panos.
      when: eagent_platform not in ['ios', 'sonic', 'sonic_community', 'fortios', 'panos']

    - name: Gather the interfaces resource from a Cisco IOS device
      cisco.ios.ios_interfaces:
        state: gathered
      when: eagent_platform == 'ios'
      register: ios_interfaces

    - name: Show interface state from a Cisco IOS device
      ansible.builtin.debug:
        var: ios_interfaces.gathered
      when: eagent_platform == 'ios'

    - name: Read interface state from a SONiC device
      # Two show commands rather than a resource module: reads only, and no
      # configuration mode. `show interfaces status` is the interface table;
      # `show vlan brief` is what an engineer asks for in the same breath.
      dellemc.enterprise_sonic.sonic_command:
        commands:
          - show interfaces status
          - show vlan brief
      when: eagent_platform == 'sonic'
      register: sonic_interfaces

    - name: Show interface state from a SONiC device
      ansible.builtin.debug:
        var: sonic_interfaces.stdout_lines
      when: eagent_platform == 'sonic'

    - name: Read interface state from a sonic_community device
      # Plain SSH and `show`: community SONiC has no Dell REST and its CLI has
      # neither `sonic-cli` nor `terminal length 0`, so network_cli can never open
      # (the failure was `unable to open sonic cli`). `raw` is skipped in check
      # mode and the job always runs in check mode, so this task opts out; it runs
      # only the fixed read-only commands below.
      ansible.builtin.raw: "{{ item }}"
      loop:
        - show interfaces status
        - show vlan brief
      check_mode: false
      changed_when: false
      register: sonic_community_interfaces
      when: eagent_platform == 'sonic_community'

    - name: Show interface state from a sonic_community device
      ansible.builtin.debug:
        msg: "{{ sonic_community_interfaces.results | items2dict(key_name='item', value_name='stdout_lines') }}"
      when: eagent_platform == 'sonic_community'

    - name: Ask the firewall
      # FortiGate and Palo Alto: their management API over HTTPS with the stored API token, GET
      # only (reads/fw/read.yml). Written from the vendors' documented output, not run against a device.
      ansible.builtin.include_tasks: fw/read.yml
      vars:
        fw_read: interfaces
        fw_requests:
          fortios:
            - "/api/v2/monitor/system/interface?include_vlan=true"
          panos:
            - "<show><interface>all</interface></show>"
      when: eagent_platform in ['fortios', 'panos']

    - name: Show interface state from the firewall
      ansible.builtin.debug:
        var: eagent_fw
      when: eagent_platform in ['fortios', 'panos']

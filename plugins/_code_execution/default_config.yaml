# Shell interface: auto = auto-detect (SSH when non-dockerized, local when dockerized),
# true = always SSH, false = always local TTY
# Execution backend.
#
# "auto" uses SSH when it is reachable and otherwise executes inside the
# application container as the server's own user. That local fallback is a
# development convenience and is not safe for a shared deployment: agent code
# would run beside the web server with its filesystem and network access.
#
# For any deployment with more than one user, point ssh_addr at a dedicated
# runner and set REZZTOR_REQUIRE_REMOTE_EXECUTION=true, which makes the local
# fallback refuse rather than silently execute in the application container.
ssh_enabled: auto

# SSH credentials (used when ssh_enabled is true or auto-detected)
# ssh_addr: derived from rfc_url setting when empty
ssh_addr: ""
ssh_port: 55022
# root only because the bundled development image has no other account. A real
# runner should present an unprivileged user with no access outside its own
# workspace. See docs/internal/decisions/0006-code-execution-is-not-sandboxed-yet.md
ssh_user: root
# ssh_pass: uses root_password from RFC exchange when empty
ssh_pass: ""

# Timeouts for python/nodejs/terminal runtimes (seconds)
code_exec_first_output_timeout: 30
code_exec_between_output_timeout: 15
code_exec_max_exec_timeout: 240
code_exec_dialog_timeout: 5

# Timeouts for "output" runtime (seconds)
output_first_output_timeout: 120
output_between_output_timeout: 60
output_max_exec_timeout: 600
output_dialog_timeout: 5

# Shell prompt detection patterns (one regex per line)
# When matched, output is returned immediately without waiting for timeout
prompt_patterns: |
  (\(venv\)).+[$#] ?$
  root@[^:]+:[^#]+# ?$
  [a-zA-Z0-9_.-]+@[^:]+:[^$#]+[$#] ?$
  \(?.*\)?\s*PS\s+[^>]+> ?$

# Dialog detection patterns (one regex per line, case-insensitive)
# When matched after dialog_timeout, control is returned to the agent
dialog_patterns: |
  Y/N
  yes/no
  :\s*$
  \?\s*$

[pytest]
# --- Collection scope ---
# Several API handlers are named like tests (api/backup_test.py, api/ws_dev_test.py,
# plugins/*/api/test_connection.py). They are ApiHandler/WsHandler classes, not pytest
# modules. Collecting them prepends their directory to sys.path, after which
# `import plugins.<name>` resolves to api/plugins.py instead of the plugins/ namespace
# package, breaking ~60 unrelated test modules.
#
# --import-mode=importlib additionally resolves duplicate test basenames across plugins
# (plugins/_ea_acp/tests/test_migration.py vs
#  plugins/_migrate_agents/tests/test_migration.py).
#
# asyncio_mode is deliberately unset: 33 test files use explicit @pytest.mark.asyncio,
# so pytest-asyncio's default strict mode preserves upstream semantics.

# --- Import path ---
# --import-mode=importlib, set below, means pytest deliberately does not put the
# rootdir on sys.path -- and conftest.py imports `helpers` at module scope.
#
# `python -m pytest` hid that for a long time: the -m form puts the working
# directory on sys.path itself, so the suite passed for everyone locally while
# CI, which runs a bare `pytest`, could not import conftest at all and failed
# collection with "No module named 'helpers'". Setting it here fixes both
# invocations rather than patching the CI command into agreeing with us.
pythonpath = .

testpaths = tests plugins
python_files = test_*.py *_test.py
norecursedirs = .git .venv usr tmp docs webui lib node_modules *.egg-info

addopts =
    --ignore-glob=*/api/*
    --import-mode=importlib
    # --- Quarantine: empty, and meant to stay that way ---
    # This block used to hold fifteen --ignore / --deselect entries, every one
    # verified failing on a pristine worktree of the upstream-fork-point tag.
    # All fifteen are gone: five named files this fork had already deleted, six
    # were re-examined and fixed, four were dead code and were deleted.
    #
    # So nothing is filtered out of this suite any more, and a failure in it is
    # a failure. Before adding an entry here, note what the old ones turned out
    # to be: two tests missing the `database` fixture, a sys.modules stub that
    # leaked by collection order, an assertion that contradicted its own
    # fixture, and a workflow contract this fork had deliberately replaced.
    # None of them needed quarantining; they needed twenty minutes each.
    #
    # To see the unfiltered truth:  pytest --override-ini=addopts= --continue-on-collection-errors
